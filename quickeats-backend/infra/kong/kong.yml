_format_version: "3.0"

services:
  - name: identity-service
    url: http://identity:8081
    routes:
      - name: identity-auth
        paths: ["/api/v1/auth"]
        strip_path: false
      - name: identity-admin
        paths: ["/api/v1/admin"]
        strip_path: false
      # Public organisation-code lookup (sign-up) and the user's own profile (settings)
      - name: identity-organisations
        paths: ["/api/v1/organisations", "/api/v1/users"]
        strip_path: false

  # React admin dashboard (static files served by nginx under /admin)
  - name: admin-dashboard
    url: http://admin:80
    routes:
      - name: admin-dashboard
        paths: ["/admin"]
        strip_path: false

  - name: catalog-service
    url: http://catalog:8082
    routes:
      - name: catalog-shops
        paths: ["/api/v1/shops", "/api/v1/menu-items"]
        strip_path: false

  - name: order-service
    url: http://order:8083
    routes:
      - name: order-routes
        paths: ["/api/v1/orders"]
        strip_path: false
      # Shop order queue and earnings live in the order service, but share the /api/v1/shops
      # prefix with catalog; the regex route takes precedence over the prefix one.
      - name: order-shop-orders
        paths: ["~/api/v1/shops/[^/]+/(orders|earnings)$"]
        regex_priority: 10
        strip_path: false

  - name: payment-service
    url: http://payment:8084
    routes:
      - name: payment-routes
        paths: ["/api/v1/payments", "/api/v1/cards"]
        strip_path: false

  # strip_path removes the whole "/notification/health" prefix, so the
  # service URL carries the upstream path: /notification/health → /health
  - name: notification-service
    url: http://notification:8085/health
    routes:
      - name: notification-health
        paths: ["/notification/health"]
        strip_path: true

  # WebSocket for live shop notifications. Kong proxies the HTTP Upgrade,
  # so clients connect to ws(s)://<host>:8000/ws and port 8086 stays private.
  - name: notification-ws
    url: http://notification:8086
    routes:
      - name: notification-ws
        paths: ["/ws"]
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 60
      policy: local
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      headers: ["Authorization", "Content-Type", "X-Request-ID", "X-Idempotency-Key"]
