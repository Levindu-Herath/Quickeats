global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Requests, status codes and latency for every microservice, as seen at the gateway
  - job_name: kong
    static_configs:
      - targets: ["kong:8100"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 30s # matches cAdvisor's housekeeping interval
    static_configs:
      - targets: ["cadvisor:8080"]
