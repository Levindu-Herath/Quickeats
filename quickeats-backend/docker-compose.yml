version: "3.9"

# One Postgres server per service (database per service): a failed database only
# takes down its own service. Memory is capped per database because four of them
# share one host with Kafka, Redis and the services.
x-postgres-defaults: &postgres-defaults
  image: postgres:16-alpine
  restart: on-failure
  command:
    - postgres
    - -c
    - shared_buffers=32MB
    - -c
    - max_connections=30
    - -c
    - work_mem=2MB
    - -c
    - maintenance_work_mem=16MB
    - -c
    - effective_cache_size=128MB
  mem_limit: 256m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 5s
    retries: 5

# One-shot jobs: each service's migrations and seed run against its own database only,
# so a broken database never blocks another service from starting.
x-migrate-defaults: &migrate-defaults
  image: migrate/migrate:v4.17.1
  volumes:
    - ./services:/services:ro

x-seed-defaults: &seed-defaults
  image: postgres:16-alpine
  volumes:
    - ./infra/seed:/seed:ro

services:
  identity-db:
    <<: *postgres-defaults
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    volumes:
      - identity-pgdata:/var/lib/postgresql/data

  catalog-db:
    <<: *postgres-defaults
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    volumes:
      - catalog-pgdata:/var/lib/postgresql/data

  order-db:
    <<: *postgres-defaults
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    volumes:
      - order-pgdata:/var/lib/postgresql/data

  payment-db:
    <<: *postgres-defaults
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    volumes:
      - payment-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Containers use kafka:29092; services run on the host (make run-*) use localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  identity-migrate:
    <<: *migrate-defaults
    command: ["-path", "/services/identity/migrations", "-database", "postgres://identity:identity@identity-db:5432/identity_db?sslmode=disable", "up"]
    depends_on:
      identity-db:
        condition: service_healthy

  catalog-migrate:
    <<: *migrate-defaults
    command: ["-path", "/services/catalog/migrations", "-database", "postgres://catalog:catalog@catalog-db:5432/catalog_db?sslmode=disable", "up"]
    depends_on:
      catalog-db:
        condition: service_healthy

  order-migrate:
    <<: *migrate-defaults
    command: ["-path", "/services/order/migrations", "-database", "postgres://order:order@order-db:5432/order_db?sslmode=disable", "up"]
    depends_on:
      order-db:
        condition: service_healthy

  payment-migrate:
    <<: *migrate-defaults
    command: ["-path", "/services/payment/migrations", "-database", "postgres://payment:payment@payment-db:5432/payment_db?sslmode=disable", "up"]
    depends_on:
      payment-db:
        condition: service_healthy

  # Demo data (idempotent). Order has none.
  identity-seed:
    <<: *seed-defaults
    command: ["psql", "postgres://identity:identity@identity-db:5432/identity_db?sslmode=disable", "-v", "ON_ERROR_STOP=1", "-f", "/seed/identity.sql"]
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

  catalog-seed:
    <<: *seed-defaults
    command: ["psql", "postgres://catalog:catalog@catalog-db:5432/catalog_db?sslmode=disable", "-v", "ON_ERROR_STOP=1", "-f", "/seed/catalog.sql"]
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully

  payment-seed:
    <<: *seed-defaults
    command: ["psql", "postgres://payment:payment@payment-db:5432/payment_db?sslmode=disable", "-v", "ON_ERROR_STOP=1", "-f", "/seed/payment.sql"]
    depends_on:
      payment-migrate:
        condition: service_completed_successfully

  kong:
    image: kong:3.6
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./infra/kong/kong.yml:/etc/kong/kong.yml
    depends_on:
      - identity
      - catalog
      - order
      - payment
      - notification
      - admin

  identity:
    restart: on-failure
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://identity:identity@identity-db:5432/identity_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      CATALOG_SERVICE_URL: http://catalog:8082
      PORT: "8081"
      # Admin dashboard login, created on first start (local dev only defaults)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@quickeats.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Canteen#Dev2026}
    depends_on:
      identity-seed:
        condition: service_completed_successfully
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  catalog:
    restart: on-failure
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://catalog:catalog@catalog-db:5432/catalog_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      PORT: "8082"
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order:
    restart: on-failure
    build:
      context: .
      dockerfile: services/order/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://order:order@order-db:5432/order_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      CATALOG_SERVICE_URL: http://catalog:8082
      PAYMENT_SERVICE_URL: http://payment:8084
      PORT: "8083"
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment:
    restart: on-failure
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgres://payment:payment@payment-db:5432/payment_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      PORT: "8084"
    depends_on:
      payment-seed:
        condition: service_completed_successfully
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification:
    restart: on-failure
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    ports:
      - "8085:8085"
      - "8086:8086"
    environment:
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      HTTP_PORT: "8085"
      WS_PORT: "8086"
      ORDER_SERVICE_URL: http://order:8083
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # React admin dashboard, served by Kong at http://localhost:8000/admin
  admin:
    build:
      context: ../clients/admin-dashboard
    restart: on-failure

volumes:
  identity-pgdata:
  catalog-pgdata:
  order-pgdata:
  payment-pgdata:
  kafkadata:
