groups:
  - name: quickeats
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} {{ $labels.pod }} is not answering Prometheus scrapes"

      # Kong answers 502/503 when a service is down, so this also catches crashed services
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(kong_http_requests_total{code=~"5.."}[5m]))
            / sum by (service) (rate(kong_http_requests_total[5m])) > 0.05
          and sum by (service) (rate(kong_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: {{ $value | humanizePercentage }} of requests fail with 5xx"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(kong_request_latency_ms_bucket[5m]))) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: p95 latency is {{ $value | humanize }} ms"

  - name: kubernetes
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $value | humanize }} times in 15 min"

      - alert: DeploymentUnavailable
        expr: kube_deployment_status_replicas_available < kube_deployment_spec_replicas
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has fewer ready pods than requested"

      - alert: StatefulSetUnavailable
        expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready pods than requested"

      # The Postgres pods are capped at 256 MiB; at the limit the kernel kills them
      - alert: ContainerNearMemoryLimit
        expr: |
          max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""})
            / max by (namespace, pod, container) (container_spec_memory_limit_bytes{container!=""} > 0) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) uses {{ $value | humanizePercentage }} of its memory limit"

  - name: host
    rules:
      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of host memory is available"

      - alert: DiskAlmostFull
        expr: |
          1 - node_filesystem_avail_bytes{mountpoint="/", fstype!="rootfs"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!="rootfs"} > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Root disk is {{ $value | humanizePercentage }} full"
