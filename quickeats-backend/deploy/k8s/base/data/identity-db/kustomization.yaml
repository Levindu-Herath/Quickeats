# identity's own Postgres server (database per service), built from ../postgres
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../postgres
namePrefix: identity-
labels:
  - pairs:
      app.kubernetes.io/name: identity-db
    includeSelectors: true
    includeTemplates: true
patches:
  - target:
      kind: StatefulSet
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: identity_db
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: identity
      - op: replace
        path: /spec/template/spec/containers/0/env/2/valueFrom/secretKeyRef/key
        value: IDENTITY_DB_PASSWORD
