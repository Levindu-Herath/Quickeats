# Template for one service's Postgres server. Each database (identity-db, catalog-db, ...)
# is a kustomization that prefixes the name and sets POSTGRES_DB/USER/PASSWORD.
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/component: database
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Small settings: four Postgres servers share the node with Kafka and the services
          args:
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=30
            - -c
            - work_mem=2MB
            - -c
            - maintenance_work_mem=16MB
            - -c
            - effective_cache_size=128MB
          env:
            - name: POSTGRES_DB
              value: set-by-overlay
            - name: POSTGRES_USER
              value: set-by-overlay
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quickeats-env
                  key: set-by-overlay
            # Subdirectory, so initdb doesn't trip over the volume's lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
