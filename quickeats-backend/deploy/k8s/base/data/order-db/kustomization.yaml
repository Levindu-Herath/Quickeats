# order's own Postgres server (database per service), built from ../postgres
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../postgres
namePrefix: order-
labels:
  - pairs:
      app.kubernetes.io/name: order-db
    includeSelectors: true
    includeTemplates: true
patches:
  - target:
      kind: StatefulSet
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: order_db
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: order
      - op: replace
        path: /spec/template/spec/containers/0/env/2/valueFrom/secretKeyRef/key
        value: ORDER_DB_PASSWORD
