# Production stack: pulls prebuilt images, publishes only Kong (host port 80).
#
#   cp .env.prod.example .env.prod      # then fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Needs these repo files on the server: infra/ and services/*/migrations/.
#
# Database per service: identity, catalog, order and payment each have their own
# Postgres server, volume and login (see x-postgres-defaults). Each DB password
# defaults to POSTGRES_PASSWORD; set <SERVICE>_DB_PASSWORD in .env.prod to separate them.

x-service-defaults: &service-defaults
  restart: unless-stopped
  # Each service answers GET /health on its own PORT; the pipeline waits for "healthy".
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s

# One Postgres server per service (database per service): a failed database only
# takes down its own service. Memory is capped per database because four of them
# share one host with Kafka, Redis and the services.
x-postgres-defaults: &postgres-defaults
  image: postgres:16-alpine
  restart: unless-stopped
  command:
    - postgres
    - -c
    - shared_buffers=32MB
    - -c
    - max_connections=30
    - -c
    - work_mem=2MB
    - -c
    - maintenance_work_mem=16MB
    - -c
    - effective_cache_size=128MB
  mem_limit: 256m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 5s
    retries: 5

# One-shot jobs: each service's migrations and seed run against its own database only,
# so a broken database never blocks another service from starting.
x-migrate-defaults: &migrate-defaults
  image: migrate/migrate:v4.17.1
  volumes:
    - ./services:/services:ro

x-seed-defaults: &seed-defaults
  image: postgres:16-alpine
  volumes:
    - ./infra/seed:/seed:ro

services:
  identity-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}}
    volumes:
      - identity-pgdata:/var/lib/postgresql/data

  catalog-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - catalog-pgdata:/var/lib/postgresql/data

  order-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - order-pgdata:/var/lib/postgresql/data

  payment-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - payment-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # Single-node Kafka in KRaft mode (no ZooKeeper). Internal only, no host port.
  # Heap is capped so it fits next to the rest of the stack and Jenkins on one instance.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  identity-migrate:
    <<: *migrate-defaults
    command: ["-path", "/services/identity/migrations", "-database", "postgres://identity:${IDENTITY_DB_PASSWORD:-${POSTGRES_PASSWORD}}@identity-db:5432/identity_db?sslmode=disable", "up"]
    depends_on:
      identity-db:
        condition: service_healthy

  catalog-migrate:
    <<: *migrate-defaults
    command: ["-path", "/services/catalog/migrations", "-database", "postgres://catalog:${CATALOG_DB_PASSWORD:-${POSTGRES_PASSWORD}}@catalog-db:5432/catalog_db?sslmode=disable", "up"]
    depends_on:
      catalog-db:
        condition: service_healthy

  order-migrate:
    <<: *migrate-defaults
    command: ["-path", "/services/order/migrations", "-database", "postgres://order:${ORDER_DB_PASSWORD:-${POSTGRES_PASSWORD}}@order-db:5432/order_db?sslmode=disable", "up"]
    depends_on:
      order-db:
        condition: service_healthy

  payment-migrate:
    <<: *migrate-defaults
    command: ["-path", "/services/payment/migrations", "-database", "postgres://payment:${PAYMENT_DB_PASSWORD:-${POSTGRES_PASSWORD}}@payment-db:5432/payment_db?sslmode=disable", "up"]
    depends_on:
      payment-db:
        condition: service_healthy

  # Demo data (idempotent). Order has none.
  identity-seed:
    <<: *seed-defaults
    command: ["psql", "postgres://identity:${IDENTITY_DB_PASSWORD:-${POSTGRES_PASSWORD}}@identity-db:5432/identity_db?sslmode=disable", "-v", "ON_ERROR_STOP=1", "-f", "/seed/identity.sql"]
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

  catalog-seed:
    <<: *seed-defaults
    command: ["psql", "postgres://catalog:${CATALOG_DB_PASSWORD:-${POSTGRES_PASSWORD}}@catalog-db:5432/catalog_db?sslmode=disable", "-v", "ON_ERROR_STOP=1", "-f", "/seed/catalog.sql"]
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully

  payment-seed:
    <<: *seed-defaults
    command: ["psql", "postgres://payment:${PAYMENT_DB_PASSWORD:-${POSTGRES_PASSWORD}}@payment-db:5432/payment_db?sslmode=disable", "-v", "ON_ERROR_STOP=1", "-f", "/seed/payment.sql"]
    depends_on:
      payment-migrate:
        condition: service_completed_successfully

  # The only container reachable from outside. Admin API is disabled.
  kong:
    image: kong:3.6
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
      # /metrics for Prometheus; no host port, so only reachable inside the compose network
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
    volumes:
      - ./infra/kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - identity
      - catalog
      - order
      - payment
      - notification
      - admin

  identity:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env.prod}/quickeats-identity:${IMAGE_TAG:-latest}
    depends_on:
      identity-seed:
        condition: service_completed_successfully
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD:-${POSTGRES_PASSWORD}}@identity-db:5432/identity_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      CATALOG_SERVICE_URL: http://catalog:8082
      PORT: "8081"
      # Admin dashboard login, created on first start if it doesn't exist
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  catalog:
    <<: *service-defaults
    image: ${IMAGE_PREFIX}/quickeats-catalog:${IMAGE_TAG:-latest}
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD:-${POSTGRES_PASSWORD}}@catalog-db:5432/catalog_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8082"

  order:
    <<: *service-defaults
    image: ${IMAGE_PREFIX}/quickeats-order:${IMAGE_TAG:-latest}
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://order:${ORDER_DB_PASSWORD:-${POSTGRES_PASSWORD}}@order-db:5432/order_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog:8082
      PAYMENT_SERVICE_URL: http://payment:8084
      PORT: "8083"

  payment:
    <<: *service-defaults
    image: ${IMAGE_PREFIX}/quickeats-payment:${IMAGE_TAG:-latest}
    depends_on:
      payment-seed:
        condition: service_completed_successfully
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://payment:${PAYMENT_DB_PASSWORD:-${POSTGRES_PASSWORD}}@payment-db:5432/payment_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8084"

  notification:
    restart: unless-stopped
    image: ${IMAGE_PREFIX}/quickeats-notification:${IMAGE_TAG:-latest}
    environment:
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      HTTP_PORT: "8085"
      WS_PORT: "8086"
      ORDER_SERVICE_URL: http://order:8083
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # React admin dashboard (static files), served by Kong at /admin
  admin:
    image: ${IMAGE_PREFIX}/quickeats-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: in this image localhost resolves to IPv6 ::1 first,
      # and nginx only listens on IPv4
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # Monitoring. Prometheus and Grafana bind to 127.0.0.1 only: reach them through
  # an SSH tunnel, no security group change. The deploy health check doesn't wait
  # on these, so a monitoring problem never rolls back a release.
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever limit is hit first; keeps the 30 GB disk safe
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.prod}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Datasource and dashboard come from the repo, so a fresh volume is ready to use
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m

  # Host CPU, memory, disk and swap
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

  # CPU and memory per container. Metrics that the dashboards don't use are off to
  # keep its own CPU and memory use low.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp,memory_numa
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 160m

volumes:
  identity-pgdata:
  catalog-pgdata:
  order-pgdata:
  payment-pgdata:
  kafkadata:
  redisdata:
  promdata:
  grafanadata:
